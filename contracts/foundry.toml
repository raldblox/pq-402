[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The Solidity tests read the TypeScript known-answer vectors.
fs_permissions = [{ access = "read", path = "../packages/core/test/vectors" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100

# Public QoreChain EVM endpoint:  forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"
